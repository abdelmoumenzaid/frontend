<div class="add-meal-page">
  <header class="add-meal-header">
    <button class="back-link" (click)="onCancel()">‹ Retour</button>
    <div class="title-block">
      <!-- ✅ TITRE DYNAMIQUE : Ajouter OU Modifier -->
      <h1>{{ mealId ? 'Modifier le repas' : 'Ajouter un repas' }}</h1>
      <p class="subtitle">
        {{ date | date : 'EEEE d MMMM y' }}
      </p>
    </div>
  </header>

  <!-- ✅ AFFICHER LES ERREURS -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- ✅ LOADING SPINNER -->
  <div *ngIf="loading" class="loading-overlay">
    <p>Chargement{{ mealId ? ' du repas...' : '...' }}</p>
  </div>

  <form class="form" (ngSubmit)="onSave()" [formGroup]="form" *ngIf="!loading">
    <div class="field">
      <label>Type de repas</label>
      <select [(ngModel)]="type" name="type" [disabled]="loading">
        <option value="BREAKFAST">Petit-déjeuner</option>
        <option value="LUNCH">Déjeuner</option>
        <option value="DINNER">Dîner</option>
        <option value="SNACK">Snack</option>
      </select>
    </div>

    <div class="field">
      <label>Heure</label>
      <input
        type="time"
        [(ngModel)]="time"
        name="time"
        [disabled]="loading"
      />
    </div>

    <div class="field">
      <label>Nom du repas / recette</label>
      <input
        type="text"
        [(ngModel)]="recipeName"
        name="recipeName"
        placeholder="Ex: Tajine poulet & olives"
        [disabled]="loading"
      />
    </div>

    <div class="field-inline">
      <div class="field">
        <label>Calories</label>
        <input
          type="number"
          [(ngModel)]="calories"
          name="calories"
          min="0"
          [disabled]="loading"
        />
      </div>
      <div class="field">
        <label>Portions</label>
        <input
          type="number"
          [(ngModel)]="servings"
          name="servings"
          min="0.1"
          step="0.1"
          [disabled]="loading"
        />
      </div>
    </div>

    <div class="field-inline">
      <div class="field">
        <label>Protéines (g)</label>
        <input
          type="number"
          [(ngModel)]="protein"
          name="protein"
          min="0"
          [disabled]="loading"
        />
      </div>
      <div class="field">
        <label>Glucides (g)</label>
        <input
          type="number"
          [(ngModel)]="carbs"
          name="carbs"
          min="0"
          [disabled]="loading"
        />
      </div>
      <div class="field">
        <label>Lipides (g)</label>
        <input
          type="number"
          [(ngModel)]="fat"
          name="fat"
          min="0"
          [disabled]="loading"
        />
      </div>
    </div>

    <div class="actions">
      <button
        type="button"
        class="btn-secondary"
        (click)="onCancel()"
        [disabled]="loading"
      >
        Annuler
      </button>
      <!-- ✅ BOUTON DYNAMIQUE : Modifier OU Ajouter -->
      <button 
        type="submit" 
        class="btn-primary" 
        [disabled]="loading || !recipeName?.trim()">
        {{ loading ? (mealId ? 'Modification...' : 'Enregistrement...') : (mealId ? 'Modifier le repas' : 'Enregistrer le repas') }}
      </button>
    </div>
  </form>
</div>
