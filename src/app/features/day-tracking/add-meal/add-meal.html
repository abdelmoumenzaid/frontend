<div class="add-meal-page">
  <header class="add-meal-header">
    <button class="back-link" (click)="onCancel()">‹ Retour</button>
    <div class="title-block">
      <h1>Ajouter un repas</h1>
      <p class="subtitle">
        {{ date | date : 'EEEE d MMMM y' : undefined : 'fr-FR' }}
      </p>
    </div>
  </header>

  <form class="form" (ngSubmit)="onSave()">
    <div class="field">
      <label>Type de repas</label>
      <select [(ngModel)]="type" name="type">
        <option value="BREAKFAST">Petit-déjeuner</option>
        <option value="LUNCH">Déjeuner</option>
        <option value="DINNER">Dîner</option>
        <option value="SNACK">Snack</option>
      </select>
    </div>

    <div class="field">
      <label>Heure</label>
      <input type="time" [(ngModel)]="time" name="time" />
    </div>

    <div class="field">
      <label>Nom du repas / recette</label>
      <input
        type="text"
        [(ngModel)]="recipeName"
        name="recipeName"
        placeholder="Ex: Tajine poulet & olives"
      />
    </div>

    <div class="field-inline">
      <div class="field">
        <label>Calories</label>
        <input
          type="number"
          [(ngModel)]="calories"
          name="calories"
          min="0"
        />
      </div>
      <div class="field">
        <label>Portions</label>
        <input
          type="number"
          [(ngModel)]="servings"
          name="servings"
          min="0.1"
          step="0.1"
        />
      </div>
    </div>

    <div class="field-inline">
      <div class="field">
        <label>Protéines (g)</label>
        <input type="number" [(ngModel)]="protein" name="protein" min="0" />
      </div>
      <div class="field">
        <label>Glucides (g)</label>
        <input type="number" [(ngModel)]="carbs" name="carbs" min="0" />
      </div>
      <div class="field">
        <label>Lipides (g)</label>
        <input type="number" [(ngModel)]="fat" name="fat" min="0" />
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-secondary" (click)="onCancel()">
        Annuler
      </button>
      <button type="submit" class="btn-primary">
        Enregistrer le repas
      </button>
    </div>
  </form>
</div>
