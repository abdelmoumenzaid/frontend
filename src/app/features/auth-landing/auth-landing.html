<div class="landing-wrapper">
  <div class="content">
    <!-- Logo Bol Recettes -->
    <div class="recipe-bowl">
      <svg width="70" height="70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Bol avec fruits -->
        <circle cx="12" cy="12" r="10" fill="#10b981" opacity="0.2"/>
        <path d="M4 14c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="10" r="1.5" fill="#ef4444"/>
        <circle cx="12" cy="8" r="1.5" fill="#fbbf24"/>
        <circle cx="16" cy="10" r="1.5" fill="#34d399"/>
        <circle cx="10" cy="12" r="1.2" fill="#60a5fa"/>
      </svg>
    </div>

    <!-- Titre -->
    <div class="header">
      <h1>Ton coach nutrition intelligent</h1>
      <p>Découvre des recettes saines inspirées de la cuisine marocaine et méditerranéenne</p>
    </div>

    <!-- Boutons -->
    <div class="cta-buttons">
      <button class="btn-primary" routerLink="/auth-register">
        Créer un compte
        </button>
      <button class="btn-secondary" (click)="login()">
        Se connecter
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>NutriCoach © 2026</span>
    </div>
  </div>
</div>
