<div class="landing-wrapper">
  <div class="content">
    <!-- Logo Bol -->
    <div class="recipe-bowl">🍲</div>

    <!-- Titre -->
    <div class="header">
      <h1>Créer ton compte</h1>
      <p>Rejoins notre communauté nutrition</p>
    </div>

    <!-- Formulaire -->
    <form class="register-form">
      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="formData.email" 
          name="email"
          placeholder="ton@email.com"
        />
      </div>

      <!-- Prénom -->
      <div class="form-group">
        <label>Prénom</label>
        <input 
          type="text" 
          [(ngModel)]="formData.firstName" 
          name="firstName"
          placeholder="Ton prénom"
        />
      </div>

      <!-- Nom -->
      <div class="form-group">
        <label>Nom</label>
        <input 
          type="text" 
          [(ngModel)]="formData.lastName" 
          name="lastName"
          placeholder="Ton nom"
        />
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label>Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="formData.password" 
          name="password"
          placeholder="Minimum 8 caractères"
        />
      </div>

      <!-- Confirmer -->
      <div class="form-group">
        <label>Confirmer mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="formData.passwordConfirm" 
          name="passwordConfirm"
          placeholder="Confirme ton mot de passe"
        />
      </div>

      <!-- Erreur -->
      <div *ngIf="error" class="error-message">
        ⚠️ {{ error }}
      </div>

      <!-- Bouton CRÉER -->
      <div class="cta-buttons">
        <button type="button" class="btn-primary" [disabled]="loading" (click)="register()">
          {{ loading ? '⏳ Création...' : '✅ Créer mon compte' }}
        </button>
      </div>
    </form>

    <!-- Lien login -->
    <div class="login-link">
      <span>Déjà un compte?
        <button type="button" class="link-btn" (click)="goToLogin()">Se connecter</button>
      </span>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>NutriCoach © 2026</span>
    </div>
  </div>
</div>
